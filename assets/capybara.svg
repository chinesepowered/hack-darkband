<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Onsen mascot</title>
  <desc id="d">A sleepy capybara soaking in a wooden hot-spring tub with a yuzu on its head while steam rises.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9563"/>
      <stop offset="1" stop-color="#b8784a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be7f2"/>
      <stop offset="1" stop-color="#4cbad6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a866"/>
      <stop offset="1" stop-color="#c0803f"/>
    </linearGradient>
    <radialGradient id="yuzu" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.55" stop-color="#ffc13b"/>
      <stop offset="1" stop-color="#f59a16"/>
    </radialGradient>
    <clipPath id="above-water">
      <!-- everything above the water's front edge -->
      <path d="M0 0H512V338C452 368 360 378 256 378C152 378 60 368 0 338Z"/>
    </clipPath>
  </defs>

  <!-- steam -->
  <g fill="none" stroke="#bfe3ee" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M92 270c-16-22 16-38 0-62s16-38 0-62"/>
    <path d="M422 286c-14-20 14-34 0-56s14-34 0-56"/>
    <path d="M456 214c-10-14 10-24 0-40"/>
  </g>

  <!-- sleepy z's, drawn as strokes so no font is needed -->
  <g fill="none" stroke="#8eb9cc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 92h22l-22 24h22"/>
    <path d="M394 56h30l-30 33h30"/>
    <path d="M434 14h38l-38 42h38"/>
  </g>

  <!-- tub: back rim and water -->
  <ellipse cx="256" cy="338" rx="184" ry="40" fill="#e9b877" stroke="#5a3824" stroke-width="7"/>
  <ellipse cx="256" cy="340" rx="164" ry="28" fill="url(#water)"/>

  <!-- capybara, above the water line -->
  <g clip-path="url(#above-water)" stroke="#4e2f1d" stroke-width="7" stroke-linejoin="round">
    <!-- shoulders -->
    <path d="M128 380c0-70 50-112 128-112s128 42 128 112z" fill="url(#fur)"/>
    <!-- ears: small nubs set high on the head -->
    <ellipse cx="186" cy="112" rx="17" ry="15" fill="#b8784a"/>
    <ellipse cx="326" cy="112" rx="17" ry="15" fill="#b8784a"/>
    <!-- head: a tall, boxy capybara loaf -->
    <path d="M168 150c0-30 24-48 58-48h60c34 0 58 18 58 48v100c0 44-30 70-88 70s-88-26-88-70z" fill="url(#fur)"/>
    <!-- snout shading, no outline -->
    <ellipse cx="256" cy="262" rx="66" ry="44" fill="#dba878" stroke="none" opacity="0.75"/>
  </g>

  <!-- face details -->
  <g stroke="#4e2f1d" stroke-linecap="round" fill="none">
    <path d="M194 170q14 11 28 0" stroke-width="7"/>
    <path d="M290 170q14 11 28 0" stroke-width="7"/>
    <path d="M256 274v10M244 288q6 6 12 0q6 6 12 0" stroke-width="4.5"/>
  </g>
  <!-- the big, flat capybara nose -->
  <rect x="218" y="238" width="76" height="36" rx="18" fill="#5c3825" stroke="#4e2f1d" stroke-width="5"/>
  <ellipse cx="240" cy="248" rx="13" ry="5" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="190" cy="214" rx="16" ry="9" fill="#f28f8f" opacity="0.7"/>
  <ellipse cx="322" cy="214" rx="16" ry="9" fill="#f28f8f" opacity="0.7"/>

  <!-- yuzu -->
  <path d="M260 50c4-14 14-22 30-24c-2 16-12 24-30 24z" fill="#6cc24a" stroke="#3f7a2a" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="256" cy="80" r="30" fill="url(#yuzu)" stroke="#a0570f" stroke-width="6"/>
  <path d="M256 52v-8" stroke="#6b4426" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="245" cy="69" rx="9" ry="6" fill="#ffffff" opacity="0.55"/>

  <!-- ripples around the capybara -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M118 348q22 8 44 0"/>
    <path d="M350 348q22 8 44 0"/>
    <path d="M196 364q60 14 120 0"/>
  </g>

  <!-- tub: front, with planks and bands -->
  <path d="M72 338c0 6 2 12 6 18l26 112c4 18 18 28 36 28h232c18 0 32-10 36-28l26-112c4-6 6-12 6-18c-16 30-96 52-184 52s-168-22-184-52z"
        fill="url(#wood)" stroke="#5a3824" stroke-width="7" stroke-linejoin="round"/>
  <g stroke="#a86a32" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M146 386l10 102"/><path d="M216 392l4 104"/><path d="M296 392l-4 104"/><path d="M366 386l-10 102"/>
  </g>
  <path d="M92 404c40 26 290 26 328 0" fill="none" stroke="#5a3824" stroke-width="9" stroke-linecap="round"/>
  <path d="M106 458c40 20 262 20 300 0" fill="none" stroke="#5a3824" stroke-width="9" stroke-linecap="round"/>
</svg>
