[project]
name = "onsen"
version = "0.1.0"
description = "Onsen: a dark software factory on BAND where the capybara gets to nap."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "band-sdk[anthropic]==9.2.1",
  "nimble_python==1.6.0",
  "anthropic>=0.75.0,<3",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
onsen-scout = "onsen.scout:main"
onsen-examiner = "onsen.examiner.agent:main"
onsen-nap-guard = "onsen.napguard:main"
onsen-register = "onsen.register:main"
onsen-smoke = "onsen.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onsen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
